apiVersion: v1
kind: ConfigMap
metadata:
  name: finsecure-config
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsecure-deployment
  labels:
    app: finsecure-pay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finsecure-pay
  template:
    metadata:
      labels:
        app: finsecure-pay
    spec:
      containers:
      - name: finsecure-pay
        image: rammmmu/finsecure-pay:v1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: finsecure-config
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: finsecure-service
spec:
  type: LoadBalancer
  selector:
    app: finsecure-pay
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080